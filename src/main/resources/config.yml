# Totem of Null (Paper). The max soldiers per player is set in game with /null config.

# The soldiers' skin. Players' clients only show skins signed by Mojang, so this has to be a real, signed skin: its
# texture "value" and "signature" (e.g. from mineskin.org). The default is a pure black skin ("black" on MineSkin,
# texture 7aede2a50b78e630235081978dfa6e9ef467acb86f7292674adb999bc2732738). Leave both empty for Steve/Alex.
soldier-skin:
  value: ''
  signature: ''
